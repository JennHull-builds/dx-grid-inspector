<!doctype html>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // The footer's Motion switch, applied before first paint. Defaults to the system setting.
      try {
        var saved = localStorage.getItem('dx-motion')
        var reduce = saved ? saved === 'reduce' : matchMedia('(prefers-reduced-motion: reduce)').matches
        document.documentElement.dataset.motion = reduce ? 'reduce' : 'full'
      } catch (e) {}
    </script>

    />
